name: Mentora V61 Polish

on:
  push:
    branches: [mentora-team-v61]
    paths: ['.github/workflows/mentora-v61-polish.yml']

permissions:
  contents: write

jobs:
  polish-v61:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mentora-team-v61
      - name: Polish and validate V61
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('team-preview/v61.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('mentora-team-v60/team-preview/assets/founder.webp','mentora-team-v61/team-preview/assets/founder.webp')
          s=s.replace("if(usedPersistentCache)d.documentElement.dataset.networkProfile=constrained?'constrained':medium?'medium':'standard';if(usedPersistentCache)d.documentElement.dataset.assetSource='persistent-cache-fallback';", "d.documentElement.dataset.networkProfile=constrained?'constrained':medium?'medium':'standard';if(usedPersistentCache)d.documentElement.dataset.assetSource='persistent-cache-fallback';")
          assert 'mentora-team-v60/team-preview/assets/founder.webp' not in s
          assert "VERSION='61'" in s
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/v61-inline.js').write_text(blocks[-1],encoding='utf-8')
          p.write_text(s,encoding='utf-8')
      - name: Check JavaScript and local resources
        shell: bash
        run: |
          node --check /tmp/v61-inline.js
          test -f team-preview/index.html
          test -f team-preview/assets/favicon.svg
          test -f team-preview/assets/founder.webp
          test -f team-preview/manifest.webmanifest
          grep -q '"start_url": "./v61.html"' team-preview/manifest.webmanifest
      - name: Commit verified polish
        shell: bash
        run: |
          rm .github/workflows/mentora-v61-polish.yml
          git config user.name 'Mentora Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add team-preview/v61.html .github/workflows/mentora-v61-polish.yml
          git commit -m 'fix(team): finalize v61 metadata and diagnostics'
          git push origin HEAD:mentora-team-v61
