<head>
  <meta charset="utf-8">

  <meta property="og:title" content="Mentora — Team & Story">
  <meta property="og:description" content="Команда, продукт и история Mentora — образовательной платформы с AI-инструментами.">

  <meta property="og:image" content="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/assets/founder.webp">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mentora — Team & Story">
  <meta name="twitter:description" content="Команда, продукт и история Mentora — образовательной платформы с AI-инструментами.">
  <meta name="twitter:image" content="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/assets/founder.webp">
  <link rel="canonical" href="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html">
  <link rel="alternate" hreflang="ru" href="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html">
  <link rel="alternate" hreflang="uz" href="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html?lang=uz">
  <link rel="alternate" hreflang="en" href="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mentora — Team & Story</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522}
    iframe{display:block;width:100%;height:100%;border:0;background:#071522}
    .boot-fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#071522;color:#f1e8d8;font:600 16px/1.5 system-ui,sans-serif;text-align:center}
    .boot-fallback[hidden]{display:none}
  </style>
</head>
<body>
  <div class="boot-fallback" id="bootFallback" hidden role="status" aria-live="polite"></div>
  <iframe id="mentoraLive" title="Mentora Team & Story" aria-label="Mentora Team & Story"></iframe>
  <noscript><div class="boot-fallback">Для просмотра Mentora Team & Story требуется JavaScript.</div></noscript>
<script>
(() => {
  'use strict';
  const VERSION='38';
  const BASE='https://raw.githack.com/abdusamadsatursunov6-afk/Mentora-Code-Showcase/mentora-team-v38/team-preview/v38.html';
  const params=new URLSearchParams(location.search);
  const requested=params.get('lang');
  const lang=requested==='en'||requested==='uz'?requested:'ru';
  const frame=document.getElementById('mentoraLive');
  const fallback=document.getElementById('bootFallback');
  const css=['v17.css','v18.css','v19.css','v20.css','v21.css','v22.css','v23.css','v24.css','v25.css','v26.css','v27.css','v28.css','v29.css','v30.css','v31.css','v32.css','v33.css','v36.css'];
  const js=['v17.js','v18.js','v19.js','v20.js','v21.js','v22.js','v23.js','v24.js','v25.js','v26.js','v27.js','v28.js','v29.js','v30.js','v31.js','v32.js','v33.js','v34.js','v35.js','v36.js'];
  const i18n=lang==='en'?'v23-i18n-en.js':lang==='uz'?'v23-i18n-uz.js':null;
  const failures=[];
  const locale={ru:'ru_RU',uz:'uz_UZ',en:'en_US'};
  const copy={
    ru:{title:'Mentora — Team & Story',description:'Команда, продукт и история Mentora — образовательной платформы с AI-инструментами.',error:'Не удалось полностью загрузить страницу. Обновите вкладку.'},
    uz:{title:'Mentora — Jamoa va tarix',description:'Mentora jamoasi, mahsuloti va tarixi — AI vositalariga ega ta’lim platformasi.',error:'Sahifani to‘liq yuklab bo‘lmadi. Sahifani yangilang.'},
    en:{title:'Mentora — Team & Story',description:'The team, product and story behind Mentora — an education platform with AI tools.',error:'The page could not be fully loaded. Please refresh the tab.'}
  };

  document.documentElement.lang=lang;

  const withTimeout=(promise,label,ms=7000)=>Promise.race([
    promise,
    new Promise(resolve=>setTimeout(()=>{failures.push(label+':timeout');resolve();},ms))
  ]);

  const loadScript=(d,src)=>withTimeout(new Promise(resolve=>{
    const s=d.createElement('script');
    s.src=src+'?v='+VERSION;
    s.onload=resolve;
    s.onerror=()=>{failures.push(src);resolve();};
    d.body.appendChild(s);
  }),src);

  const loadStyle=(d,src)=>withTimeout(new Promise(resolve=>{
    const l=d.createElement('link');
    l.rel='stylesheet';
    l.href=src+'?v='+VERSION;
    l.onload=resolve;
    l.onerror=()=>{failures.push(src);resolve();};
    d.head.appendChild(l);
  }),src);

  const syncParent=()=>{
    try{
      const h=frame.contentWindow.location.hash;
      if(h&&h!==location.hash)history.replaceState(history.state,'',location.pathname+location.search+h);
    }catch(_){}
  };

  const syncShellMeta=()=>{
    const meta=copy[lang];
    const suffix=lang==='ru'?'':`?lang=${lang}`;
    const url=BASE+suffix+(location.hash||'');
    document.title=meta.title;
    frame.title=meta.title;
    frame.setAttribute('aria-label',meta.title);
    document.querySelector('meta[name="description"]').content=meta.description;
    document.querySelector('meta[property="og:title"]').content=meta.title;
    document.querySelector('meta[property="og:description"]').content=meta.description;
    document.querySelector('meta[property="og:locale"]').content=locale[lang];
    document.querySelector('meta[property="og:url"]').content=url;
    document.querySelector('meta[property="og:image:alt"]').content=meta.title;
    document.querySelector('meta[name="twitter:title"]').content=meta.title;
    document.querySelector('meta[name="twitter:description"]').content=meta.description;
    document.querySelector('link[rel="canonical"]').href=url;
  };

  const patchBaseHtml=(html)=>html
    .replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/gi,'')
    .replace(/<meta\s+property=["']og:image["'][^>]*>/gi,'<meta property="og:image" content="assets/founder.webp">')
    .replace(/<picture><source media="\(max-width: 760px\)" srcset="assets\/founder-abdusamad-720\.webp" type="image\/webp"><source srcset="assets\/founder-abdusamad-1152\.webp" type="image\/webp"><img src="assets\/founder-abdusamad\.jpeg" width="1152" height="1536" decoding="async" alt="Abdusamad Shatursunov"><\/picture>/g,
      '<img src="assets/founder.webp" width="1152" height="1536" decoding="async" fetchpriority="high" alt="Abdusamad Shatursunov">')
    .replace('<div><b>10+</b><span>языков интерфейса</span></div>','<div><b>MULTI</b><span>мультиязычный интерфейс</span></div>');

  const bootFrame=async()=>{
    syncShellMeta();
    let html='';
    try{
      const response=await fetch('index.html?v='+VERSION,{cache:'no-store'});
      if(!response.ok)throw new Error('index:'+response.status);
      html=patchBaseHtml(await response.text());
    }catch(error){
      failures.push(String(error&&error.message||error));
      fallback.hidden=false;
      fallback.textContent=copy[lang].error;
      frame.hidden=true;
      return;
    }

    frame.srcdoc=html;
    frame.addEventListener('load',async()=>{
      const d=frame.contentDocument;
      if(!d)return;
      try{
        d.documentElement.lang=lang;
        await Promise.all(css.map(file=>loadStyle(d,file)));
        if(i18n)await loadScript(d,i18n);
        for(const file of js)await loadScript(d,file);
      }finally{
        d.documentElement.dataset.runtimeHealth=failures.length?'degraded':'ready';
        d.documentElement.dataset.bundleVersion=VERSION;
        d.querySelectorAll('.reveal,[data-critical-content="true"]').forEach(n=>n.classList.add('is-visible'));
        d.querySelector('.page-loader')?.classList.add('is-hidden');
        if(failures.length)console.warn('Mentora V38 loaded with optional asset failures:',failures);
        frame.contentWindow.addEventListener('hashchange',syncParent);
        frame.contentWindow.addEventListener('mentora:chapterchange',syncParent);
        if(location.hash)frame.contentWindow.location.hash=location.hash;
        syncParent();
      }
    },{once:true});
  };

  window.addEventListener('hashchange',()=>{
    try{frame.contentWindow.location.hash=location.hash;}catch(_){}
    syncShellMeta();
  });

  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
    const data=event.data||{};
    if(data.type==='mentora:meta'){
      document.documentElement.lang=data.lang||lang;
      document.title=data.title||document.title;
      const meta=document.querySelector('meta[name="description"]');
      if(meta&&data.description)meta.content=data.description;
      if(data.hash&&data.hash!==location.hash)history.replaceState(history.state,'',location.pathname+location.search+data.hash);
    }else if(data.type==='mentora:hash'&&data.hash&&data.hash!==location.hash){
      history.replaceState(history.state,'',location.pathname+location.search+data.hash);
    }
  });

  bootFrame();
})();
</script>
</body>
</html>
