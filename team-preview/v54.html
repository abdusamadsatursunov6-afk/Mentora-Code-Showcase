const obs=new MutationObserver(()=>{for(const a of d.querySelectorAll('a[href*="v53.html"],a[href*="mentora-team-v53"]')){let targetLang='ru';try{const u=new URL(a.href,location.href);const q=u.searchParams.get('lang');targetLang=q==='en'||q==='uz'?q:'ru'}catch(_){}const hash=a.hash||'';a.href=`v54.html${targetLang==='ru'?'':`?lang=${targetLang}`}${hash}`}});obs.observe(d.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['href']});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!navigator.onLine)showNetwork(copy[lang].offline,true)});
syncMeta();if(!navigator.onLine)showNetwork(copy[lang].offline,true);load();

})();
