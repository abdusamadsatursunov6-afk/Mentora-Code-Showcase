<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#172554" />
    <title>Mentora — нет подключения</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 36px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 20px 60px rgb(15 23 42 / 8%);
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 20px;
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 26px;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
        line-height: 1.55;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        background: #172554;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/mentora-192.png" alt="Mentora" />
      <h1>Нет подключения к интернету</h1>
      <p>
        Сохранённые элементы интерфейса доступны, но для уроков и AI-генерации нужно восстановить
        соединение.
      </p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
